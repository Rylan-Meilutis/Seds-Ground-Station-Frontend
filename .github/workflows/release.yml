name: Release
# Tag-triggered GitHub Release: Windows, Linux (x86_64 + arm64), Android and
# macOS, built with the same scripts/ci/frontend.py bootstrap and build.py code
# paths as the build-only CI (platforms.yml), plus optional uploads to
# TestFlight (optionally to named beta groups) and a Google Play testing track
# (internal, alpha or beta; never production). This is the ONLY workflow that
# uses production signing material, all of it from secrets; see
# docs/releasing.md. Untrusted pull requests never run it. The version job
# refuses any run that is not from a protected ref, or whose tag is not on
# main or dev, and every job holding a secret depends on it.
# No job here restores a dependency cache: a cache written by a less-trusted run
# could change a signed build. Gradle download outages are retried instead.
'on':
  push:
    tags:
    - v*.*.*b*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.3.1b36
        required: true
        type: string
      skip_macos:
        description: Publish without the macOS DMGs (e.g. Apple secrets not set yet)
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build, sign and verify only; keep the signed assets as workflow artifacts. No GitHub Release, TestFlight or Play upload
        required: false
        type: boolean
        default: true
      play_track:
        description: Google Play testing track (tag pushes use the PLAY_TRACK repository variable, default internal)
        required: false
        type: choice
        options:
        - internal
        - alpha
        - beta
        default: internal
      testflight_groups:
        description: Comma-separated TestFlight beta groups to add the build to (empty uses the TESTFLIGHT_GROUPS variable; none = internal testers only)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Every core of the hosted runner (scripts/ci/frontend.py ci_env).
  CI_CARGO_JOBS: cores
  CARGO_INCREMENTAL: '0'
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      guarded: ${{ steps.guard.outputs.guarded }}
      ref: ${{ steps.guard.outputs.ref }}
    steps:
    - uses: actions/checkout@v4
      with:
        # A dispatched dry run builds the protected branch head it was started from
        # (no tag needed); everything else builds the release tag.
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && github.sha || format('refs/tags/{0}', env.RELEASE_TAG) }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Protected ref, tag on main or dev
      id: guard
      env:
        RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      run: python scripts/ci/frontend.py release-guard
    - name: Tag matches Cargo.toml version and Dioxus.toml build
      id: version
      run: python scripts/ci/frontend.py release-version --tag "$RELEASE_TAG"
    - run: python -m pip install PyYAML==6.0.3
    - name: CI contracts
      run: python -W error -m unittest discover -s tests -p 'test_ci*.py' -v
  unsigned:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
        - target: linux
          runner: ubuntu-24.04
        - target: linux-arm64
          runner: ubuntu-24.04-arm
        - target: windows
          runner: windows-2022
    env:
      CI_FRONTEND_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Linux native libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libclang-dev cmake ninja-build patchelf file unzip zip fuse3 libfuse2t64 rpm makepkg libarchive-tools pacman-package-manager fakeroot flatpak desktop-file-utils appstream gnupg zstd
    - name: Windows MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Pinned frontend tools, warnings fatal
      run: python scripts/ci/frontend.py bootstrap
    - name: Release build, warnings fatal
      run: python scripts/ci/frontend.py release-build
    - name: Stage release assets
      run: python scripts/ci/frontend.py release-stage
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: release-assets/${{ matrix.target }}/
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: release-logs-${{ matrix.target }}
        path: ci-results/
        retention-days: 7
  android:
    needs: version
    if: ${{ needs.version.outputs.guarded == 'true' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        target:
        - android
        - android-armv7
    env:
      CI_FRONTEND_TARGET: ${{ matrix.target }}
      ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Android SDK and NDK
      shell: bash
      run: 'sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"'
    - name: Pinned frontend tools, warnings fatal
      run: python scripts/ci/frontend.py bootstrap
    - name: Production signing keystore from secrets
      env:
        ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      run: python scripts/ci/frontend.py release-android-signing
    - name: Release build and production signing, warnings fatal
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      run: python scripts/ci/frontend.py release-build
    - name: Verify APK signature
      run: python scripts/ci/frontend.py release-verify
    - name: Stage release assets
      run: python scripts/ci/frontend.py release-stage
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: release-assets/${{ matrix.target }}/
        if-no-files-found: error
        retention-days: 7
    - name: Delete signing material
      if: always()
      run: python scripts/ci/frontend.py release-cleanup
  # Launch gate (no secrets): the x86_64 release-profile APK of the same
  # commit, built through the same strip, R8 and bundletool path as the store
  # build but signed with a throwaway CI key, must install, start, stay up and
  # render on an API 36 emulator (scripts/android_launch_smoke.py). publish,
  # dry-run and the Play upload wait for it. Hosted arm64 runners expose no
  # KVM, so the arm64 store APK itself cannot be launched here.
  android-launch:
    needs: version
    if: ${{ needs.version.outputs.guarded == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_FRONTEND_TARGET: android_sim
      CI_FRONTEND_PROFILE: release
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Android SDK and NDK
      shell: bash
      run: 'sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"'
    - name: Pinned frontend tools, warnings fatal
      run: python scripts/ci/frontend.py bootstrap
    - name: x86_64 release APK, CI development key, warnings fatal
      run: python scripts/ci/frontend.py build
    - name: Pillow for the screenshot check
      run: python -m pip install -r requirements.txt
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Launch on the API 36 emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        ram-size: 4096M
        disk-size: 6000M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        disable-animations: true
        script: python scripts/android_launch_smoke.py --apk artifacts/android_sim --component com.UBSEDS.GS26/dev.dioxus.main.MainActivity --out launch-output --wait 45 --require-render-log
    # Not named release-*: publish merges every release-* artifact into the assets.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-launch-release-api36
        path: launch-output/
        if-no-files-found: warn
        retention-days: 7
  macos:
    needs: version
    if: ${{ !inputs.skip_macos && needs.version.outputs.guarded == 'true' }}
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
        - target: macos
          runner: xcode-27
        - target: macos-intel
          runner: macos-15-intel
    env:
      CI_FRONTEND_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    # Apple silicon builds with Xcode 27 (macOS 27 SDK). The xcode-27 image
    # has no Intel variant, so the Intel DMG keeps its image's Xcode 26.
    - name: Xcode 27 on Apple silicon
      if: matrix.runner == 'xcode-27'
      run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
    - name: Xcode availability
      run: xcodebuild -version
    - name: Pinned frontend tools, warnings fatal
      run: python scripts/ci/frontend.py bootstrap
    - name: Developer ID keychain and notarization profile from secrets
      env:
        MACOS_DEVELOPER_ID_P12_B64: ${{ secrets.MACOS_DEVELOPER_ID_P12_B64 }}
        MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        APPLE_NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
        APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: python scripts/ci/frontend.py release-macos-signing
    - name: Release build, Developer ID signing and notarization, warnings fatal
      run: python scripts/ci/frontend.py release-build
    - name: Verify signature, notarization and Gatekeeper
      run: python scripts/ci/frontend.py release-verify
    - name: Stage release assets
      run: python scripts/ci/frontend.py release-stage
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: release-assets/${{ matrix.target }}/
        if-no-files-found: error
        retention-days: 7
    - name: Delete signing material
      if: always()
      run: python scripts/ci/frontend.py release-cleanup
  publish:
    needs:
    - version
    - unsigned
    - android
    - macos
    - android-launch
    if: ${{ always() && !inputs.dry_run && needs.version.result == 'success' && needs.version.outputs.guarded == 'true' && needs.unsigned.result == 'success' && needs.android.result == 'success' && needs.android-launch.result == 'success' && (needs.macos.result == 'success' || (inputs.skip_macos && needs.macos.result == 'skipped')) }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      TITLE: ${{ needs.version.outputs.name }}
      MACOS_INCLUDED: ${{ needs.macos.result == 'success' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true
    - name: Check the asset set and write SHA256SUMS
      shell: bash
      run: |
        targets=linux,linux-arm64,windows,android,android-armv7
        if [ "$MACOS_INCLUDED" = "true" ]; then targets="$targets,macos,macos-intel"; fi
        python scripts/ci/frontend.py release-checksums --assets release-assets --release-targets "$targets"
    - name: Create or update the GitHub Release
      shell: bash
      run: |
        set -euo pipefail
        notes="docs/release-notes/$TAG.md"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "$TITLE"
          if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false
        else
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          # Draft first so nobody sees a release with half its assets.
          gh release create "$TAG" --verify-tag --draft --title "$TITLE" "${notes_args[@]}"
          gh release upload "$TAG" release-assets/*
          gh release edit "$TAG" --draft=false
        fi
        {
          echo "## Published $TITLE"
          echo
          echo '```'
          cat release-assets/SHA256SUMS
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
  # Manual dry run: the same builds, production signing and verification as a
  # release, but nothing is published. The signed assets stay downloadable as
  # the release-<target> workflow artifacts (7 days); this job only checks the
  # set and records SHA256SUMS in the summary. No secrets, read-only token.
  dry-run:
    needs:
    - version
    - unsigned
    - android
    - macos
    - android-launch
    if: ${{ always() && inputs.dry_run && needs.version.result == 'success' && needs.unsigned.result == 'success' && needs.android.result == 'success' && needs.android-launch.result == 'success' && (needs.macos.result == 'success' || (inputs.skip_macos && needs.macos.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MACOS_INCLUDED: ${{ needs.macos.result == 'success' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true
    - name: Check the signed asset set (nothing is published)
      shell: bash
      run: |
        targets=linux,linux-arm64,windows,android,android-armv7
        if [ "$MACOS_INCLUDED" = "true" ]; then targets="$targets,macos,macos-intel"; fi
        python scripts/ci/frontend.py release-checksums --assets release-assets --release-targets "$targets"
        {
          echo "## Dry run: nothing published"
          echo
          echo 'Signed assets are the `release-*` artifacts of this run.'
          echo
          echo '```'
          cat release-assets/SHA256SUMS
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
  # Store uploads: TestFlight (App Store Connect, never submitted for App Store
  # review; optionally added to TESTFLIGHT_GROUPS, with a beta app review for
  # external groups) and one Google Play testing track (PLAY_TRACK: internal,
  # alpha or beta; production is refused). Each job skips with a notice when
  # its store secrets are unset; the GitHub Release (publish) does not depend
  # on either job. Inputs and variables reach the driver only through env.
  testflight:
    needs: version
    if: ${{ needs.version.outputs.guarded == 'true' }}
    environment: release
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      CI_FRONTEND_TARGET: ios
      # App Store Connect requires the iOS 27 SDK (ITMS-90725; refused from
      # April 2027) and a deployment target of iOS 15 or later (ITMS-90068).
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TESTFLIGHT_GROUPS: ${{ inputs.testflight_groups || vars.TESTFLIGHT_GROUPS }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: TestFlight secrets configured
      id: store
      env:
        IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
        IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        IOS_APPSTORE_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_B64 }}
        APPLE_NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
        APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      run: python scripts/ci/frontend.py release-store-check --store testflight
    - uses: actions/setup-node@v4
      if: steps.store.outputs.enabled == 'true'
      with:
        node-version: '22'
    - name: Xcode availability
      if: steps.store.outputs.enabled == 'true'
      run: xcodebuild -version
    - name: Pinned frontend tools, warnings fatal
      if: steps.store.outputs.enabled == 'true'
      run: python scripts/ci/frontend.py bootstrap
    - name: App Store distribution keychain and profile from secrets
      if: steps.store.outputs.enabled == 'true'
      env:
        IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
        IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        IOS_APPSTORE_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_B64 }}
      run: python scripts/ci/frontend.py release-ios-signing
    - name: Release IPA, App Store signing, warnings fatal
      if: steps.store.outputs.enabled == 'true'
      run: python scripts/ci/frontend.py release-store-build
    - name: Verify IPA identity, version and signature
      if: steps.store.outputs.enabled == 'true'
      run: python scripts/ci/frontend.py release-store-verify
    - name: Upload to TestFlight and add to the selected beta groups
      if: ${{ !inputs.dry_run && steps.store.outputs.enabled == 'true' }}
      env:
        APPLE_NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
        APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      run: python scripts/ci/frontend.py release-store-upload
    - name: Delete signing material
      if: always()
      run: python scripts/ci/frontend.py release-cleanup
  play:
    needs:
    - version
    - android-launch
    if: ${{ needs.version.outputs.guarded == 'true' && needs.android-launch.result == 'success' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_FRONTEND_TARGET: android
      ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
      PLAY_TRACK: ${{ inputs.play_track || vars.PLAY_TRACK || 'internal' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.version.outputs.ref }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Google Play secrets configured, testing track allowed
      id: store
      env:
        PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: python scripts/ci/frontend.py release-store-check --store play
    - uses: actions/setup-node@v4
      if: steps.store.outputs.enabled == 'true'
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      if: steps.store.outputs.enabled == 'true'
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      if: steps.store.outputs.enabled == 'true'
      with:
        packages: platform-tools
    - name: Android SDK and NDK
      if: steps.store.outputs.enabled == 'true'
      shell: bash
      run: 'sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"'
    - name: Pinned frontend tools, warnings fatal
      if: steps.store.outputs.enabled == 'true'
      run: python scripts/ci/frontend.py bootstrap
    - name: Upload keystore from secrets
      if: steps.store.outputs.enabled == 'true'
      env:
        ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      run: python scripts/ci/frontend.py release-android-signing
    - name: Release AAB, upload-key signing, warnings fatal
      if: steps.store.outputs.enabled == 'true'
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      run: python scripts/ci/frontend.py release-store-build
    - name: Verify AAB signer, package and versionCode
      if: steps.store.outputs.enabled == 'true'
      run: python scripts/ci/frontend.py release-store-verify
    - name: Upload to the selected Play testing track
      if: ${{ !inputs.dry_run && steps.store.outputs.enabled == 'true' }}
      env:
        PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
      run: python scripts/ci/frontend.py release-store-upload
    - name: Delete signing material
      if: always()
      run: python scripts/ci/frontend.py release-cleanup
