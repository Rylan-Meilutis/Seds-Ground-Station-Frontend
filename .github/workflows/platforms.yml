name: All frontend platforms
'on':
  push:
    branches:
    - dev
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install PyYAML==6.0.3
    - run: python -W error -m unittest discover -s tests -p 'test_ci*.py' -v
  build:
    needs: contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
        - web
        - linux
        - linux-arm64
        - windows
        - macos
        - macos-intel
        - ios
        - android
        - android-armv7
        - ios_sim
        - ios_sim_intel
        - android_sim
        profile:
        - debug
        - release
        include:
        - target: web
          runner: ubuntu-24.04
        - target: linux
          runner: ubuntu-24.04
        - target: linux-arm64
          runner: ubuntu-24.04-arm
        - target: windows
          runner: windows-2022
        - target: macos
          runner: macos-15
        - target: macos-intel
          runner: macos-15-intel
        - target: ios
          runner: macos-15
        - target: android
          runner: ubuntu-24.04
        - target: android-armv7
          runner: ubuntu-24.04
        - target: ios_sim
          runner: macos-15
        - target: ios_sim_intel
          runner: macos-15-intel
        - target: android_sim
          runner: ubuntu-24.04
    env:
      CI_FRONTEND_TARGET: ${{ matrix.target }}
      CI_FRONTEND_PROFILE: ${{ matrix.profile }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Linux native libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libclang-dev cmake ninja-build patchelf file unzip zip fuse3 libfuse2t64 rpm makepkg fakeroot flatpak desktop-file-utils zstd
    - name: Windows MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Xcode availability
      if: runner.os == 'macOS'
      run: 'xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-version

        xcrun --sdk iphonesimulator --show-sdk-version'
    - uses: actions/setup-java@v4
      if: startsWith(matrix.target, 'android')
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
      if: startsWith(matrix.target, 'android')
    - name: Android SDK and NDK
      if: startsWith(matrix.target, 'android')
      shell: bash
      run: 'sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"'
    - name: Pinned frontend tools, warnings fatal
      run: python scripts/ci/frontend.py bootstrap
    - name: Actual native target build, warnings fatal
      run: python scripts/ci/frontend.py build
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-${{ matrix.target }}-${{ matrix.profile }}
        path: 'artifacts/${{ matrix.target }}/

          ci-results/'
        if-no-files-found: error
        retention-days: 7
