name: All frontend platforms
'on':
  push:
    branches:
    - dev
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python -m pip install PyYAML==6.0.3
    - run: python -W error -m unittest discover -s tests -p 'test_ci*.py' -v
  build:
    needs: contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # GitHub's own per-account limits (20 jobs, 5 macOS for a public repo)
      # do the throttling; at 4 the 34 builds queued for hours.
      max-parallel: 20
      matrix:
        target:
        - web
        - linux
        - linux-arm64
        - windows
        - macos
        - macos-intel
        - ios
        - android
        - android-armv7
        - watchos
        - wearos
        - ios_sim
        - ios_sim_intel
        - android_sim
        - watchos_sim
        - watchos_sim_intel
        - wearos_sim
        profile:
        - debug
        - release
        # Release builds every target. Debug only where it adds coverage: the
        # web and desktop debug paths, and the emulator builds the launch test
        # installs (scripts/ci/platforms.json "debug").
        exclude:
        - target: linux-arm64
          profile: debug
        - target: windows
          profile: debug
        - target: macos
          profile: debug
        - target: macos-intel
          profile: debug
        - target: ios
          profile: debug
        - target: android
          profile: debug
        - target: android-armv7
          profile: debug
        - target: watchos
          profile: debug
        - target: wearos
          profile: debug
        - target: ios_sim
          profile: debug
        - target: ios_sim_intel
          profile: debug
        - target: watchos_sim
          profile: debug
        - target: watchos_sim_intel
          profile: debug
        include:
        - target: web
          runner: ubuntu-24.04
        - target: linux
          runner: ubuntu-24.04
        - target: linux-arm64
          runner: ubuntu-24.04-arm
        - target: windows
          runner: windows-2022
        - target: macos
          runner: xcode-27
        - target: macos-intel
          runner: macos-15-intel
        - target: ios
          runner: xcode-27
        - target: android
          runner: ubuntu-24.04
        - target: android-armv7
          runner: ubuntu-24.04
        - target: watchos
          runner: xcode-27
        - target: wearos
          runner: ubuntu-24.04
        - target: ios_sim
          runner: xcode-27
        - target: ios_sim_intel
          runner: macos-15-intel
        - target: android_sim
          runner: ubuntu-24.04
        - target: watchos_sim
          runner: xcode-27
        - target: watchos_sim_intel
          runner: macos-15-intel
        - target: wearos_sim
          runner: ubuntu-24.04
    env:
      CI_FRONTEND_TARGET: ${{ matrix.target }}
      CI_FRONTEND_PROFILE: ${{ matrix.profile }}
      # Every core of the hosted runner (scripts/ci/frontend.py ci_env).
      CI_CARGO_JOBS: cores
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Linux native libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libclang-dev cmake ninja-build patchelf file unzip zip fuse3 libfuse2t64 rpm makepkg libarchive-tools pacman-package-manager fakeroot flatpak desktop-file-utils appstream gnupg zstd
    - name: Windows MSVC environment
      if: runner.os == 'Windows'
      # What ilammy/msvc-dev-cmd did (it has no Node 24 release): run the
      # newest Visual Studio's vcvars64.bat and export what it changed.
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools' }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $lines = cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed: $LASTEXITCODE" }
        foreach ($line in $lines) {
          if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
        if (-not ($lines -match '^VCToolsInstallDir=')) { throw 'vcvars64.bat set no VCToolsInstallDir' }
    # App Store Connect requires the iOS 27 SDK (ITMS-90725), as the store
    # build uses. The xcode-27 image is Apple silicon only; the Intel
    # simulator and macOS targets stay on Xcode 26 until an Intel image has 27.
    - name: Xcode 27 (iOS 27 SDK) on Apple silicon
      if: matrix.runner == 'xcode-27'
      run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
    - name: Xcode 26 for the Intel iOS simulator
      if: startsWith(matrix.target, 'ios') && matrix.runner != 'xcode-27'
      run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
    - name: Xcode availability
      if: runner.os == 'macOS'
      run: 'xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-version

        xcrun --sdk iphonesimulator --show-sdk-version'
    - name: watchOS SDK and XcodeGen
      if: startsWith(matrix.target, 'watchos')
      run: 'xcrun --sdk watchos --show-sdk-version

        xcrun --sdk watchsimulator --show-sdk-version

        brew install xcodegen'
    - uses: actions/setup-java@v5
      if: startsWith(matrix.target, 'android') || startsWith(matrix.target, 'wearos')
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
      if: startsWith(matrix.target, 'android') || startsWith(matrix.target, 'wearos')
    - name: Android SDK and NDK
      if: startsWith(matrix.target, 'android') || startsWith(matrix.target, 'wearos')
      shell: bash
      run: 'sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"'
    # Downloaded dependencies only; nothing a build generates and no signing
    # files. Build-only CI: the release workflow never restores this cache.
    - name: Cached Gradle downloads
      id: gradle-downloads
      if: startsWith(matrix.target, 'android') || startsWith(matrix.target, 'wearos')
      uses: actions/cache/restore@v5
      with:
        path: |
          .gradle-user-home/caches/modules-2
          .gradle-user-home/wrapper/dists
          !.gradle-user-home/caches/modules-2/modules-2.lock
          !.gradle-user-home/caches/modules-2/gc.properties
        key: gradle-downloads-${{ startsWith(matrix.target, 'wearos') && 'wearos' || 'android' }}-${{ hashFiles('build.py', 'Cargo.toml', 'watch/wear/**/*.gradle.kts', 'watch/wear/gradle/**') }}
        restore-keys: gradle-downloads-${{ startsWith(matrix.target, 'wearos') && 'wearos' || 'android' }}-
    # The dx CLI takes 20-35 minutes to compile. bootstrap uses a restored copy
    # only if it reports the exact version the lock resolved, else rebuilds it.
    # release.yml restores the same keys (tags read main's caches).
    - name: Cached dx build tool
      if: ${{ !startsWith(matrix.target, 'wearos') }}
      uses: actions/cache/restore@v5
      with:
        path: .ci-tools/dx
        key: dx-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}--restore-only
        restore-keys: dx-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}--
    - name: Pinned frontend tools, warnings fatal
      id: bootstrap
      run: python scripts/ci/frontend.py bootstrap
    # Compiled dependencies, not the app's own crates; after bootstrap, which
    # resolves Cargo.lock and installs the pinned toolchain. Saved on push only.
    - name: Cached compiled dependencies
      if: ${{ !startsWith(matrix.target, 'wearos') }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      with:
        prefix-key: v1-deps
        shared-key: ${{ matrix.target }}-${{ matrix.profile }}
        add-job-id-key: false
        cache-bin: false
        save-if: ${{ github.event_name == 'push' }}
    # Release rows save, so debug and release never race for the same key.
    - name: Save the dx build tool
      if: github.event_name == 'push' && matrix.profile == 'release' && steps.bootstrap.outputs.dx-built == 'true'
      uses: actions/cache/save@v5
      with:
        path: .ci-tools/dx
        key: dx-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}--${{ steps.bootstrap.outputs.dx-version }}
    - name: Actual native target build, warnings fatal
      run: python scripts/ci/frontend.py build
    - name: Save Gradle downloads
      if: github.event_name == 'push' && matrix.profile == 'release' && (matrix.target == 'android' || matrix.target == 'wearos') && steps.gradle-downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          .gradle-user-home/caches/modules-2
          .gradle-user-home/wrapper/dists
          !.gradle-user-home/caches/modules-2/modules-2.lock
          !.gradle-user-home/caches/modules-2/gc.properties
        key: ${{ steps.gradle-downloads.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: frontend-${{ matrix.target }}-${{ matrix.profile }}
        path: 'artifacts/${{ matrix.target }}/

          ci-results/'
        if-no-files-found: error
        retention-days: 7
  # Install and start the APKs the build job made, on an x86_64 emulator, and
  # fail if the app does not stay up and render (scripts/android_launch_smoke.py).
  # A build that succeeds can still fail to start: a missing or stripped
  # libmain.so, JNI classes renamed by R8, a native crash, a blank web view.
  # Release goes through the same strip, R8 and bundletool path as the store
  # build. API 24 (minSdk) only for release, to keep the cost down. Hosted
  # arm64 runners expose no KVM, so the arm64 store APK cannot run here.
  android-launch:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: android_sim
          profile: debug
          api: 36
          image: google_apis
          ram: 4096M
          component: com.UBSEDS.GS26/dev.dioxus.main.MainActivity
          render: --require-render-log
        - target: android_sim
          profile: release
          api: 36
          image: google_apis
          ram: 4096M
          component: com.UBSEDS.GS26/dev.dioxus.main.MainActivity
          render: --require-render-log
        - target: android_sim
          profile: release
          api: 24
          # The API 24 google_apis image hung in boot (adb stopped answering).
          image: default
          # With 4 GB the API 24 image never finishes booting and adb hangs;
          # 2 GB boots in seconds (reproduced on a local emulator).
          ram: 2048M
          component: com.UBSEDS.GS26/dev.dioxus.main.MainActivity
          # The API 24 image's built-in WebView (52, from 2016) is years older
          # than what real Android 7 devices get through Play and cannot run
          # the page, so only the Rust side counts: it must start, not panic,
          # and keep running.
          render: --require-launch-log --no-screen-check
        # Debug: the release Wear APK is unsigned here (no keystore in this
        # workflow), and Android will not install an unsigned APK.
        - target: wearos_sim
          profile: debug
          api: 34
          image: android-wear
          ram: 4096M
          component: com.UBSEDS.GS26/com.ubseds.gs26.wear.MainActivity
          render: ''
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Pillow for the screenshot check
      run: python -m pip install -r requirements.txt
    - uses: actions/download-artifact@v7
      with:
        name: frontend-${{ matrix.target }}-${{ matrix.profile }}
        path: launch-input
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Launch on the API ${{ matrix.api }} emulator
      timeout-minutes: 25
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
      with:
        api-level: ${{ matrix.api }}
        target: ${{ matrix.image }}
        arch: x86_64
        ram-size: ${{ matrix.ram }}
        disk-size: 6000M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        disable-animations: true
        script: python scripts/android_launch_smoke.py --apk launch-input/artifacts/${{ matrix.target }} --component ${{ matrix.component }} --out launch-output --wait 45 ${{ matrix.render }}
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: android-launch-${{ matrix.target }}-${{ matrix.profile }}-api${{ matrix.api }}
        path: launch-output/
        if-no-files-found: warn
        retention-days: 7
