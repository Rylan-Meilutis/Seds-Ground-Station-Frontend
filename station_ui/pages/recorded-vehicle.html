<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recorded flight replay</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111d2b;color:#e4eff8;font:14px system-ui}gs-vehicle-viewer{display:block;position:relative;width:100%;height:100%}.label{position:absolute;z-index:4;top:12px;left:12px;padding:7px 10px;background:#142534e8;border:1px solid #6b9db9;border-radius:8px;font-weight:800;letter-spacing:.08em;pointer-events:none}.time{position:absolute;z-index:4;bottom:12px;left:12px;right:12px;padding:8px 10px;background:#111d2bdd;border-radius:8px;font-variant-numeric:tabular-nums;pointer-events:none}.controls{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:6px}.controls button{min-width:44px;min-height:44px;padding:8px;background:#142534e8;border:1px solid #6b9db9;border-radius:8px;color:inherit;font:inherit;cursor:pointer}@media(max-width:440px){.label{font-size:11px;top:10px;left:8px}.controls{top:46px;right:8px}.time{font-size:11px;bottom:8px;left:8px;right:8px}}
</style></head><body><gs-vehicle-viewer aria-label="Recorded rocket flight"></gs-vehicle-viewer><div class="label">RECORDED FLIGHT · REPLAY</div><div class="controls"><button data-camera="follow" title="Follow the recorded rocket">Follow</button><button data-camera="overview" title="Frame the saved trajectory">Path</button><button data-camera="reset" title="Reset the replay camera">Reset</button></div><div class="time" role="status">Loading saved flight…</div><script type="module">
import {SavedReplayPlayer} from '/assets/three/saved-replay-player.js';
const viewer=document.querySelector('gs-vehicle-viewer'),status=document.querySelector('.time');
const player=new SavedReplayPlayer(viewer,{ticket:new URL(location.href).searchParams.get('ticket')||'',status:value=>status.textContent=value});
for(const button of document.querySelectorAll('[data-camera]'))button.onclick=()=>viewer.cameraAction?.(button.dataset.camera);
addEventListener('pagehide',()=>player.stop(),{once:true});
</script></body></html>
