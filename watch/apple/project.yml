# XcodeGen spec: `xcodegen generate` in this directory creates GS26Watch.xcodeproj.
name: GS26Watch
options:
  bundleIdPrefix: com.UBSEDS
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  WatchCore:
    path: WatchCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Xcode (Signing & Capabilities). It must be the
    # same team that signs the iOS app com.UBSEDS.GS26.
    DEVELOPMENT_TEAM: ""

targets:
  GS26Watch:
    # Single-target watchOS app (watchOS 10+, no WatchKit extension).
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: GS26Watch
    dependencies:
      - package: WatchCore
        product: WatchCore
    settings:
      base:
        PRODUCT_NAME: GS26Watch
        PRODUCT_BUNDLE_IDENTIFIER: com.UBSEDS.GS26.watchkitapp
        INFOPLIST_FILE: GS26Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: NO
        ENABLE_PREVIEWS: YES

schemes:
  GS26Watch:
    build:
      targets:
        GS26Watch: all
    run:
      config: Debug
    archive:
      config: Release
