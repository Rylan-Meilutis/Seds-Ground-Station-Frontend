stages:
- contracts
- build
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
  - if: $CI_PIPELINE_SOURCE == "web"
variables:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
# Runners: GitLab has only generic instance runners (Docker executor, no
# tags). Jobs that build in an unprivileged x86_64 Linux container run there
# (ci-contracts, web, Android, Wear OS). Desktop Linux, Windows and Apple
# targets keep their gs-ui-* tags and stay pending until those runners are
# registered; see scripts/ci/CI-RUNNERS.md. This project publishes nothing:
# releases are GitHub-only (docs/releasing.md).
ci-contracts:
  stage: contracts
  interruptible: true
  image: python:3.11-bookworm
  timeout: 5m
  script:
  - python -m pip install PyYAML==6.0.3
  - python -W error -m unittest discover -s tests -p 'test_ci*.py' -v
.frontend-build:
  stage: build
  interruptible: true
  needs:
  - ci-contracts
  timeout: 2h
  script:
  - python scripts/ci/frontend.py bootstrap
  - python scripts/ci/frontend.py build
  artifacts:
    when: always
    expire_in: 7 days
    name: frontend-$CI_FRONTEND_TARGET-$CI_FRONTEND_PROFILE
    paths:
    - artifacts/
    - ci-results/
# Generic instance runners (Docker). Prerequisites are installed per job.
frontend-build-docker:
  extends: .frontend-build
  image: python:3.11-bookworm
  before_script:
  - . scripts/ci/gitlab_docker_prereqs.sh
  parallel:
    matrix:
    - CI_FRONTEND_TARGET: web
      CI_FRONTEND_PROFILE:
      - debug
      - release
    - CI_FRONTEND_TARGET: android
      CI_FRONTEND_PROFILE:
      - release
    - CI_FRONTEND_TARGET: android-armv7
      CI_FRONTEND_PROFILE:
      - release
    - CI_FRONTEND_TARGET: wearos
      CI_FRONTEND_PROFILE:
      - release
    - CI_FRONTEND_TARGET: android_sim
      CI_FRONTEND_PROFILE:
      - debug
      - release
    - CI_FRONTEND_TARGET: wearos_sim
      CI_FRONTEND_PROFILE:
      - debug
      - release
# Native shell runners that must be registered with these tags. Off unless
# the project CI variable GS_UI_NATIVE_RUNNERS is "true": without the runners
# these 12 jobs stay pending, and with them a pipeline exceeds the project's
# limit on jobs in active pipelines, so GitLab refuses to create it at all.
frontend-build:
  extends: .frontend-build
  rules:
  - if: $GS_UI_NATIVE_RUNNERS == "true"
  tags:
  - $UI_RUNNER
  parallel:
    matrix:
    - CI_FRONTEND_TARGET: linux
      CI_FRONTEND_PROFILE:
      - debug
      - release
      UI_RUNNER: gs-ui-linux-x64
    - CI_FRONTEND_TARGET: linux-arm64
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-linux-arm64
    - CI_FRONTEND_TARGET: windows
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-windows-x64
    - CI_FRONTEND_TARGET: macos
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-arm64
    - CI_FRONTEND_TARGET: macos-intel
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-x64
    - CI_FRONTEND_TARGET: ios
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-arm64
    - CI_FRONTEND_TARGET: watchos
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-arm64
    - CI_FRONTEND_TARGET: ios_sim
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-arm64
    - CI_FRONTEND_TARGET: ios_sim_intel
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-x64
    - CI_FRONTEND_TARGET: watchos_sim
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-arm64
    - CI_FRONTEND_TARGET: watchos_sim_intel
      CI_FRONTEND_PROFILE:
      - release
      UI_RUNNER: gs-ui-macos-x64
